[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "video2agent"
version = "0.3.6"
description = "Bilibili/Douyin favorites gathering dust? Want your agent to gain video retrieval and understanding? Choose Video2Agent! One-click install gives your agent top-tier video understanding and turns online video into an information source. Whether you are researching social trends or working in media, any task that requires watching videos can now be handed to Video2Agent. Local-first; optional cloud ASR/OCR; optional Bilibili/Douyin login to unlock favorites/history and CC/AI subtitles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DSH-Video2Agent contributors" }]
keywords = ["video", "agent", "asr", "ocr", "bilibili", "douyin", "favorites", "timestamps", "retrieval", "search", "dsh"]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9",
  "yt-dlp>=2026.10.21",
  "requests>=2.31",
  "faster-whisper>=1.0",
]

[project.urls]
Repository = "https://github.com/Harm0ny-AI/DSH-Video2Agent"
Homepage = "https://github.com/Harm0ny-AI/DSH-Video2Agent#readme"
Issues = "https://github.com/Harm0ny-AI/DSH-Video2Agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# Local OCR is optional: rapidocr-onnxruntime has no Python 3.13 wheel, so keeping
# it in the core deps made `pip install video2agent` fail on 3.13 machines (the
# marketplace one-click install then failed with `No matching distribution`).
# Cloud OCR works without it; local OCR needs `pip install "video2agent[ocr]"`.
ocr = ["rapidocr>=3.10", "onnxruntime>=1.20"]
# Optional: Douyin account reads/QR login drive the installed Chrome/Edge through
# Playwright (the JSON APIs need signatures). No browser download is bundled.
browser = ["playwright>=1.45"]

[project.scripts]
video2agent = "video2agent.cli:main"
v2a = "video2agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video2agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills/video2agent" = "video2agent/skills/video2agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.sdist]
# An sdist carries the source, the skill, tests and the license — not the
# documentation images or the npm package.
include = [
  "src/video2agent",
  "skills/video2agent",
  "tests",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_LICENSES.md",
  "pyproject.toml",
]
# Never ship the documentation site or the npm package inside the sdist.
exclude = ["docs", "packages", "marketplace", ".github", ".github/**"]