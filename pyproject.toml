[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "video2agent"
version = "0.1.0"
description = "Video search and understanding for AI agents: transcript, scenes, on-screen text, frames."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DSH-Video2Agent contributors" }]
keywords = ["video", "agent", "asr", "ocr", "bilibili", "timestamps", "retrieval", "search", "dsh"]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9",
  "yt-dlp>=2026.10.21",
  "requests>=2.31",
  "faster-whisper>=1.0",
  "rapidocr-onnxruntime>=1.3",
]

[project.urls]
Repository = "https://github.com/Harm0ny-AI/DSH-Video2Agent"
Homepage = "https://github.com/Harm0ny-AI/DSH-Video2Agent#readme"
Issues = "https://github.com/Harm0ny-AI/DSH-Video2Agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
video2agent = "video2agent.cli:main"
v2a = "video2agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video2agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills/video2agent" = "video2agent/skills/video2agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.sdist]
# An sdist carries the source, the skill, tests and the license — not the
# documentation images or the npm package.
include = [
  "src/video2agent",
  "skills/video2agent",
  "tests",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_LICENSES.md",
  "pyproject.toml",
]
# Never ship the documentation site or the npm package inside the sdist.
exclude = ["docs", "packages", "marketplace", ".github", ".github/**"]