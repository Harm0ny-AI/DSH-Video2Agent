name: publish

# Publishing is token-free: PyPI and npm exchange a GitHub OIDC token for a
# short-lived publish credential (trusted publishing). No API keys in secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pack the DSH plugin
        run: |
          cd packages/dsh-video2agent
          npm pack
          mkdir -p ../../dist
          mv ./*.tgz ../../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: dist/*.tgz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Skip the plugin tarball; PyPI only takes wheel + sdist.
          skip-existing: true

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use the npm CLI that supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publishing + provenance)
        run: |
          cd packages/dsh-video2agent
          npm publish --access public --provenance

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: plugin-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
          fail_on_unmatched_files: true