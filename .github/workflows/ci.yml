name: ci

# Two runners × two Python versions run the Python suite; packaging runs once.
#
# Deliberately not covered here:
# - Windows DPAPI secret storage on Linux: tests/test_cloud.py skips those cases
#   with an explicit reason instead of faking a pass. The Windows leg covers them.
# - Real ASR: CI does not download the ~464MB model. Caption verification is
#   exercised with mocks, test_asr.py skips. A nightly job is the right place for
#   a real model, not this matrix; this file must not claim otherwise.
# - Bilibili network calls and paid cloud ASR/OCR: mocked or skipped. No secrets.

on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "packages/dsh-video2agent/README.md"
      - "packages/dsh-video2agent/assets/**"
      - "packages/dsh-video2agent/screenshots.json"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "packages/dsh-video2agent/README.md"
      - "packages/dsh-video2agent/assets/**"
      - "packages/dsh-video2agent/screenshots.json"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Generate the CLI fixture
        run: python tests/fixtures/make_ci_fixture.py

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ocr]"
          # Keep the legacy OCR engine tested too: it still serves users on
          # Python 3.11/3.12 (the extra itself now installs rapidocr 3.x).
          python -m pip install rapidocr-onnxruntime

      - name: Ruff
        run: ruff check src tests --select E,F,I --ignore E501

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the optional Config peer
        working-directory: packages/dsh-video2agent
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/schemastery@3.18.5

      - name: DSH card harness
        run: node tests/test_plugin_card.mjs

      - name: DSH plugin manifest
        run: node tests/test_plugin_manifest.mjs

      - name: DSH host routes and structured errors
        env:
          REQUIRE_SCHEMASTER: "1"
        run: node tests/test_plugin_host_settings.mjs

      - name: DSH campaign queue
        run: node tests/test_plugin_campaign.mjs

      - name: DSH dock state (clear/dismiss/settings honesty)
        run: node tests/test_plugin_dock_state.mjs

      - name: JSON encoding
        run: node scripts/check-json-bom.mjs packages/dsh-video2agent/package.json

      - name: DSH safety guards (Windows only)
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-dangerous-ps.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-live-home.ps1

  # The upgrade gate: a real public 0.3.3 wheel -> this commit's candidate wheel,
  # through the plugin's own startup path, in an isolated venv + isolated home.
  # Three modes share the same harness: a managed record (in-place), a legacy
  # record with no provenance (adopted into <home>/engines/<version>/venv-<attempt>), and
  # no record with the old CLI first on PATH (adopted the same way). The legacy
  # modes also prove the old 0.3.3 interpreter is left untouched and that the
  # registered tool calls the new private interpreter.
  # macOS is the leg the other jobs do not cover (Linux/Windows mock the upgrade).
  # No real pip runs on a developer machine; this job is the isolated environment.
  # The harness needs Python + Node + PyPI egress only (no npm/ffmpeg/Playwright/
  # schemastery); it pins the public 0.3.3 wheel by sha256 and keeps every artifact
  # under .promo/upgrade-smoke-*.
  macos-upgrade:
    name: macOS upgrade smoke (real 0.3.3 -> candidate)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the candidate wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Real managed upgrade (public 0.3.3 -> candidate)
        env:
          # The harness auto-detects python3.11/3.12/3.13; pin the setup-python
          # interpreter so the venv is built by the same Python the job installed.
          VIDEO2AGENT_TEST_PYTHON: python
        run: |
          version=$(node -p "require('./packages/dsh-video2agent/package.json').version")
          wheel=$(ls "dist/video2agent-${version}-"*.whl | head -n 1)
          VIDEO2AGENT_UPGRADE_WHEEL="$wheel" node tests/test_plugin_upgrade_smoke.mjs

      - name: Legacy record adopts a private engine at startup
        env:
          VIDEO2AGENT_TEST_PYTHON: python
          VIDEO2AGENT_SMOKE_LEGACY: "1"
        run: |
          version=$(node -p "require('./packages/dsh-video2agent/package.json').version")
          wheel=$(ls "dist/video2agent-${version}-"*.whl | head -n 1)
          VIDEO2AGENT_UPGRADE_WHEEL="$wheel" node tests/test_plugin_upgrade_smoke.mjs

      - name: PATH-only 0.3.3 adopts a private engine at startup
        env:
          VIDEO2AGENT_TEST_PYTHON: python
          VIDEO2AGENT_SMOKE_PATH: "1"
        run: |
          version=$(node -p "require('./packages/dsh-video2agent/package.json').version")
          wheel=$(ls "dist/video2agent-${version}-"*.whl | head -n 1)
          VIDEO2AGENT_UPGRADE_WHEEL="$wheel" node tests/test_plugin_upgrade_smoke.mjs

  package:
    name: package (wheel + plugin tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Assert the wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              for required in (
                  "video2agent/visual.py",
                  "video2agent/caption_verify.py",
                  "video2agent/skills/video2agent/SKILL.md",
              ):
                  assert required in names, required
              skill = z.read("video2agent/skills/video2agent/SKILL.md").decode("utf-8")
              assert "caption_check" in skill, "SKILL.md does not mention caption_check"
          print("wheel OK:", wheel)
          PY

      - name: Build plugin tarball
        working-directory: packages/dsh-video2agent
        run: |
          npm pack
          tar -tzf dsh-video2agent-*.tgz | grep -q 'package/index.js'
          tar -tzf dsh-video2agent-*.tgz | grep -q 'package/campaign.js'
          tar -tzf dsh-video2agent-*.tgz | grep -q 'package/client.js'
          tar -tzf dsh-video2agent-*.tgz | grep -q 'package/package.json'

      - name: Install the wheel into a clean venv
        run: |
          python -m venv .venv-check
          . .venv-check/bin/activate
          python -m pip install --no-deps dist/*.whl
          video2agent --version
          video2agent --help > /dev/null
          python -c "import video2agent, sys; print('installed:', video2agent.__file__)"
          deactivate

      - uses: actions/upload-artifact@v4
        with:
          name: video2agent-artifacts
          if-no-files-found: error
          path: |
            dist/*.whl
            packages/dsh-video2agent/*.tgz
