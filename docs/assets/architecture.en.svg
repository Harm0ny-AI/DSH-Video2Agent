<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">How Video2Agent works</title>
  <desc id="desc">Three-stage pipeline: ingest videos into a local searchable library, search text first, then inspect matching source frames on demand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091529"/>
      <stop offset="0.5" stop-color="#132b4c"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4e79b2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#091529" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142947" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d1c33" stop-opacity="0.96"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2,2 L10,6 L2,10 L4,6 Z" fill="#ff7a45"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#2d4c78" stroke-opacity="0.7"/>

  <!-- Header -->
  <text x="48" y="48" fill="#ff7a45" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">WORKFLOW · TEXT FIRST, PIXELS ON REQUEST</text>
  <text x="48" y="80" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700">Index once, search across transcripts &amp; OCR, inspect exact source frames</text>

  <!-- Step 1: Video Sources -->
  <g transform="translate(48, 112)">
    <rect width="316" height="240" rx="14" fill="url(#cardBg)" stroke="#355888" stroke-width="1.5"/>
    <rect x="20" y="20" width="64" height="24" rx="12" fill="#ff7a45" fill-opacity="0.16" stroke="#ff7a45" stroke-opacity="0.6"/>
    <text x="52" y="36" text-anchor="middle" fill="#ff9a72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700">STEP 1</text>
    <text x="20" y="72" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700">Video Sources</text>
    <text x="20" y="98" fill="#9db6d8" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">Single links, favorites, or local media</text>

    <rect x="20" y="118" width="276" height="32" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="34" y="139" fill="#dce9fa" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">• Bilibili videos, favorites &amp; history</text>

    <rect x="20" y="158" width="276" height="32" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="34" y="179" fill="#dce9fa" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">• Douyin links, works, favorites &amp; likes</text>

    <rect x="20" y="198" width="276" height="28" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="34" y="217" fill="#dce9fa" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">• Local MP4s / batches of 1–10 videos</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="370" y1="232" x2="424" y2="232" stroke="#ff7a45" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Local Library -->
  <g transform="translate(432, 112)">
    <rect width="336" height="240" rx="14" fill="url(#cardBg)" stroke="#355888" stroke-width="1.5"/>
    <rect x="20" y="20" width="64" height="24" rx="12" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="52" y="36" text-anchor="middle" fill="#93c5fd" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700">STEP 2</text>
    <text x="20" y="72" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700">Local Library</text>
    <text x="20" y="98" fill="#9db6d8" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">Local-first multimodal index &amp; smart cache</text>

    <rect x="20" y="118" width="144" height="46" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="32" y="138" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Captions &amp; ASR</text>
    <text x="32" y="156" fill="#8ea9cc" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5">Verified CC · Whisper</text>

    <rect x="172" y="118" width="144" height="46" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="184" y="138" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">On-screen OCR</text>
    <text x="184" y="156" fill="#8ea9cc" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5">Slides · Charts · UI text</text>

    <rect x="20" y="172" width="144" height="46" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="32" y="192" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Scenes &amp; Sheets</text>
    <text x="32" y="210" fill="#8ea9cc" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5">3×3 grids · Motion peaks</text>

    <rect x="172" y="172" width="144" height="46" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="184" y="192" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Search Index</text>
    <text x="184" y="210" fill="#8ea9cc" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5">Timecoded · ~99% saved</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="774" y1="232" x2="828" y2="232" stroke="#ff7a45" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Agent Search & Verify -->
  <g transform="translate(836, 112)">
    <rect width="316" height="240" rx="14" fill="url(#cardBg)" stroke="#ff7a45" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="20" y="20" width="64" height="24" rx="12" fill="#6ee7b7" fill-opacity="0.16" stroke="#6ee7b7" stroke-opacity="0.6"/>
    <text x="52" y="36" text-anchor="middle" fill="#6ee7b7" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700">STEP 3</text>
    <text x="20" y="72" fill="#f7fbff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700">Search &amp; Verify</text>
    <text x="20" y="98" fill="#9db6d8" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">Quote and pixels share the exact frame</text>

    <rect x="20" y="118" width="276" height="32" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="34" y="139" fill="#dce9fa" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">1. Search text, outline &amp; compare 1–10</text>

    <rect x="20" y="158" width="276" height="32" rx="8" fill="#0b182d" stroke="#ff7a45" stroke-opacity="0.55"/>
    <text x="34" y="179" fill="#ffe1d4" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">2. Fetch source frame + same-frame text</text>

    <rect x="20" y="198" width="276" height="28" rx="8" fill="#0b182d" stroke="#28466e"/>
    <text x="34" y="217" fill="#dce9fa" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13">3. Answer with timecoded citations</text>
  </g>
</svg>
